<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Byte</title>
<link rel="stylesheet" href="estilos.css">
<style>
  body{display:flex;flex-direction:column;gap:12px;padding:16px;background:#16161d}
  body.mac{background:rgba(22,22,30,.35);border-radius:14px}
  .arriba{display:flex;align-items:center;gap:14px}
  .arriba b{font:600 17px var(--f-marca);display:block}
  .arriba .abrir{margin-left:auto;border:0;background:var(--velo);border-radius:9px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--luna-2)}
  .arriba .abrir:hover{color:var(--luna)}
  .ondas{display:flex;gap:3px;align-items:center;height:24px;justify-content:center;opacity:.25;transition:opacity .3s}
  .ondas i{width:4px;height:5px;border-radius:3px;background:var(--emo);box-shadow:0 0 8px var(--emo)}
  body[data-estado="hablando"] .ondas{opacity:1}
  body[data-estado="hablando"] .ondas i{animation:onda 1.1s ease-in-out infinite}
  body[data-estado="pensando"] .ondas{opacity:.6}
  body[data-estado="pensando"] .ondas i{animation:onda 1.8s ease-in-out infinite}
  .ondas i:nth-child(odd){animation-delay:-.4s}.ondas i:nth-child(3n){animation-delay:-.7s}
  @keyframes onda{0%,100%{height:5px}50%{height:22px}}
  .chat{flex:1;overflow:auto;min-height:0;gap:8px}
  .msg{font-size:13px;max-width:88%}
  .entrada{margin:0}
  .rapidos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .rapidos button{font-size:12px;font-weight:500;background:var(--velo);border:1px solid var(--linea);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left}
  .rapidos button:hover{border-color:rgba(242,237,225,.25)}
</style>
</head>
<body data-estado="desconectado">
  <div class="arriba">
    <div class="byte" style="--s:54px" data-estado="desconectado"><i class="ojo"></i><i class="ojo"></i></div>
    <div><b id="frase">Hola, Alejandro</b><span class="estado" id="estado" data-estado="desconectado">sin conexión</span></div>
    <button class="abrir" id="abrir" aria-label="Abrir Byte Desk" title="Abrir Byte Desk"></button>
  </div>
  <div class="ondas" id="ondas"></div>
  <div class="chat" id="chat" aria-live="polite"></div>
  <div class="rapidos" id="rapidos">
    <button data-p="Hola Byte">Saludar</button>
    <button data-p="¿Qué clima hace hoy?">¿Qué clima hace?</button>
    <button data-p="Pon música tranquila en Spotify">Música tranquila</button>
    <button data-ir="tareas">Mis tareas</button>
  </div>
  <form class="entrada" id="f-chat">
    <input id="texto" placeholder="Pregúntale a Byte…" autocomplete="off" maxlength="2000" aria-label="Mensaje para Byte">
    <button class="boton-redondo" type="submit" id="enviar" aria-label="Enviar"></button>
  </form>
<script src="comun.js"></script>
<script src="panel.js"></script>
</body>
</html>
